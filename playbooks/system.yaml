---
- name: System Defaults
  hosts: managed_servers
  become: true
  gather_facts: true
  vars:
    security_ssh_allowed_users: >-
      {{ [ansible_user] + ([hermes_git_username | default('hermes-git')] if inventory_hostname == 'homeeins-1' else []) }}
    security_sudoers_passwordless:
      - "{{ ansible_user }}"
  roles:
    - role: host_setup
      tags: [defaults]
    - role: security
      tags: [defaults, security]

- name: Docker
  hosts: docker_hosts
  become: true
  gather_facts: true
  roles:
    - role: geerlingguy.docker
      tags: [defaults, docker]
