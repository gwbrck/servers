---
- name: Load SOPS secrets
  hosts: localhost
  gather_facts: false
  tags: [always, sops]
  vars:
    sops_file: "{{ lookup('env', 'HOME') }}/OpenCloud/Dots/server_infra.yaml"
  tasks:
    - name: Decrypt SOPS file
      no_log: true
      ansible.builtin.set_fact:
        sops_raw: "{{ lookup('community.sops.sops', sops_file) | from_yaml }}"

    - name: Require a SOPS mapping
      no_log: true
      ansible.builtin.assert:
        that: sops_raw is mapping
        fail_msg: "The SOPS file must contain a YAML mapping."

    - name: Share SOPS secrets with managed hosts
      no_log: true
      ansible.builtin.set_fact:
        sops_data: "{{ sops_raw }}"
