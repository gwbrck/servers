- name: Deploy Hermes environment
  hosts: hermes-vm
  become: true
  gather_facts: false
  tags: [hermes]
  vars:
    hermes_sops_file: /Users/gwbrck/OpenCloud/Dots/hermes.sops.env
  tasks:
    - name: Copy encrypted Hermes environment
      ansible.builtin.copy:
        src: "{{ hermes_sops_file }}"
        dest: /home/gwbrck/.config/sops/hermes.sops.env
        owner: gwbrck
        group: gwbrck
        mode: "0600"
