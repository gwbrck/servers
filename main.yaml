- name: Load SOPS secrets
  hosts: localhost
  gather_facts: false
  tags: [always, sops]
  vars:
    sops_file: "{{ lookup('env', 'HOME') }}/OpenCloud/Dots/server_infra.yaml"
  tasks:
    - name: Decrypt SOPS file
      no_log: true
      ansible.builtin.set_fact:
        sops_raw: "{{ lookup('community.sops.sops', sops_file, errors='ignore') | from_yaml }}"

    - name: Map SOPS secrets
      no_log: true
      ansible.builtin.set_fact:
        sops_data:
          mydefaults: "{{ sops_raw.mydefaults | default({}, true) }}"
          tailscale: "{{ sops_raw.tailscale | default({}, true) }}"
          proxy: "{{ sops_raw.proxy | default({}, true) }}"
          vaultwarden: "{{ sops_raw.vaultwarden | default({}, true) }}"
          s3_hetzner: "{{ sops_raw.s3_hetzner | default({}, true) }}"
          ntfy: "{{ sops_raw.ntfy | default({}, true) }}"
          opencloud: "{{ sops_raw.opencloud | default({}, true) }}"
          freshrss: "{{ sops_raw.freshrss | default({}, true) }}"
          immich: "{{ sops_raw.immich | default({}, true) }}"
          audiobookshelf: "{{ sops_raw.audiobookshelf | default({}, true) }}"
          actual_budget: "{{ sops_raw.actual_budget | default({}, true) }}"
          uptime_kuma: "{{ sops_raw.uptime_kuma | default({}, true) }}"
          vdirsyncer: "{{ sops_raw.vdirsyncer | default({}, true) }}"
          kiwifs: "{{ sops_raw.kiwifs | default({}, true) }}"
          zotero_mcp: "{{ sops_raw.zotero_mcp | default({}, true) }}"
          hermes_git: "{{ sops_raw.hermes_git | default({}, true) }}"

- name: Discover working SSH access
  hosts: all:!localhost
  gather_facts: false
  tags: [always]
  tasks:
    - name: Remember the configured administrator
      ansible.builtin.set_fact:
        bootstrap_admin_user: "{{ ansible_user }}"

    - name: Try administrator and root on configured and initial SSH ports
      ansible.builtin.include_tasks: tasks/bootstrap_probe.yaml
      loop:
        - { user: "{{ bootstrap_admin_user }}", port: "{{ security_ssh_port }}" }
        - { user: "{{ bootstrap_admin_user }}", port: 22 }
        - { user: root, port: "{{ security_ssh_port }}" }
        - { user: root, port: 22 }
      loop_control:
        loop_var: bootstrap_candidate

    - name: Require SSH access
      ansible.builtin.assert:
        that: bootstrap_connection is defined
        fail_msg: "No SSH connection with root privileges succeeded for {{ inventory_hostname }} as {{ bootstrap_admin_user }} or root on ports {{ security_ssh_port }} and 22. Check SSH keys, host keys and sudo access (use -k for SSH password login or -K for a sudo password)."

    - name: Use the working connection for provisioning
      ansible.builtin.set_fact:
        ansible_user: "{{ bootstrap_connection.user }}"
        ansible_port: "{{ bootstrap_connection.port }}"

- name: System Defaults
  hosts:
    - pivpn
    - homeeins-1
    - hermes
  become: true
  gather_facts: true
  vars:
    security_ssh_allowed_users: >-
      {{ [ansible_user] + ([hermes_git_username | default('hermes-git')] if inventory_hostname == 'homeeins-1' else []) }}
    security_sudoers_passwordless:
      - "{{ ansible_user }}"
  roles:
    - role: mydefaults
      tags: [defaults]
    - role: security
      tags: [defaults, security]

- name: Docker
  hosts:
    - pivpn
    - homeeins-1
  become: true
  gather_facts: true
  roles:
    - role: geerlingguy.docker
      tags: [defaults, docker]


- name: Tailscale
  hosts:
    - pivpn
    - homeeins-1
    - hermes
  become: true
  gather_facts: true
  tags: [tailscale]
  pre_tasks:
    - name: Ensure IP forwarding sysctl settings
      ansible.posix.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        sysctl_set: true
        state: present
      loop:
        - { name: "net.ipv4.ip_forward", value: "1" }
        - { name: "net.ipv6.conf.all.forwarding", value: "1" }
      notify: Reload sysctl

  roles:
    - role: artis3n.tailscale.machine
      vars:
        verbose: true
        tailscale_authkey: "{{ sops.tailscale.client_secret }}"
        tailscale_tags:
          - "server"
        tailscale_args: >-
          --accept-dns=true
          --advertise-exit-node
          --advertise-routes={{ ansible_facts.default_ipv4.network }}/{{ ansible_facts.default_ipv4.prefix }}
        tailscale_oauth_ephemeral: false
        tailscale_oauth_preauthorized: false

  handlers:
    - name: Reload sysctl
      ansible.builtin.command: sysctl -p
      changed_when: false

