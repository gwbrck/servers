---
- name: Ensure SSH daemon is running
  ansible.builtin.service:
    name: "{{ security_sshd_name }}"
    enabled: true
    state: "{{ security_sshd_state }}"

- name: Update SSH configuration
  ansible.builtin.lineinfile:
    path: "{{ security_ssh_config_path }}"
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    state: present
    validate: "sshd -T -f %s"
    mode: "0644"
  loop:
    - regexp: "^PubkeyAuthentication"
      line: "PubkeyAuthentication {{ security_ssh_pubkey_authentication }}"
    - regexp: "^AuthenticationMethods"
      line: "AuthenticationMethods {{ security_ssh_authentication_methods }}"
    - regexp: "^PasswordAuthentication"
      line: "PasswordAuthentication {{ security_ssh_password_authentication }}"
    - regexp: "^PermitRootLogin"
      line: "PermitRootLogin {{ security_ssh_permit_root_login }}"
    - regexp: "^Port"
      line: "Port {{ security_ssh_port }}"
    - regexp: "^UseDNS"
      line: "UseDNS {{ security_ssh_usedns }}"
    - regexp: "^PermitEmptyPasswords"
      line: "PermitEmptyPasswords {{ security_ssh_permit_empty_password }}"
    - regexp: "^(ChallengeResponseAuthentication|KbdInteractiveAuthentication)\\s+"
      line: "KbdInteractiveAuthentication {{ security_ssh_kbd_interactive_authentication }}"
    - regexp: "^GSSAPIAuthentication"
      line: "GSSAPIAuthentication {{ security_ssh_gss_api_authentication }}"
    - regexp: "^X11Forwarding"
      line: "X11Forwarding {{ security_ssh_x11_forwarding }}"
    - regexp: "^AllowAgentForwarding"
      line: "AllowAgentForwarding {{ security_ssh_allow_agent_forwarding }}"
    - regexp: "^PermitTunnel"
      line: "PermitTunnel {{ security_ssh_permit_tunnel }}"
  notify:
    - Reload systemd daemon
    - Restart SSH

- name: Add configured SSH users
  ansible.builtin.lineinfile:
    path: "{{ security_ssh_config_path }}"
    regexp: "^AllowUsers"
    line: "AllowUsers {{ security_ssh_allowed_users | join(' ') }}"
    state: present
    validate: "sshd -T -f %s"
    mode: "0644"
  when: security_ssh_allowed_users | length > 0
  notify: Restart SSH

- name: Configure passwordless sudo
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: "^{{ item }}"
    line: "{{ item }} ALL=(ALL) NOPASSWD: ALL"
    state: present
    validate: "visudo -cf %s"
    mode: "0440"
  loop: "{{ security_sudoers_passwordless }}"

- name: Configure passworded sudo
  ansible.builtin.lineinfile:
    path: /etc/sudoers
    regexp: "^{{ item }}"
    line: "{{ item }} ALL=(ALL) ALL"
    state: present
    validate: "visudo -cf %s"
    mode: "0440"
  loop: "{{ security_sudoers_passworded }}"

- name: Inspect SSH socket activation
  ansible.builtin.command:
    argv:
      - systemctl
      - show
      - "{{ security_sshd_name }}.socket"
      - --property=LoadState
  register: security_ssh_socket_status
  changed_when: false
  check_mode: false

- name: Validate SSH configuration before disabling socket activation
  ansible.builtin.command: "sshd -t -f {{ security_ssh_config_path | quote }}"
  changed_when: false

- name: Disable and stop SSH socket activation
  ansible.builtin.systemd_service:
    name: "{{ security_sshd_name }}.socket"
    enabled: false
    state: stopped
  when: "'LoadState=loaded' in security_ssh_socket_status.stdout_lines"
  notify: Restart SSH

- name: Apply SSH configuration before changing connection port
  ansible.builtin.meta: flush_handlers

- name: Use the hardened SSH port
  ansible.builtin.set_fact:
    ansible_port: "{{ security_ssh_port }}"

- name: Reset the SSH connection after changing ports
  ansible.builtin.meta: reset_connection

- name: Verify SSH on the hardened port
  ansible.builtin.wait_for_connection:
    timeout: 60
