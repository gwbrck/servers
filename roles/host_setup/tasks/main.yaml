- name: Provision administrator before other system defaults
  ansible.builtin.import_tasks: account.yaml
  tags: [always]

- name: Install standard command-line tools
  become: true
  ansible.builtin.package:
    name:
      - git
      - curl
    state: present

- name: "Install global alias profile script"
  ansible.builtin.copy:
    dest: /etc/profile.d/99-ansible-aliases.sh
    owner: root
    group: root
    mode: "0644"
    content: |
      # Convenience aliases managed by Ansible
      alias l='ls -la'
      alias ..='cd ..'

- name: "Lock the password for the 'root' user"
  ansible.builtin.user:
    name: root
    state: present
    password: "{{ sops.host_setup.password_hashed | default('', true) }}"
    password_lock: true

- name: "Set up qemu-guest-agent on QEMU/KVM guests"
  when:
    - ansible_facts.virtualization_role == 'guest'
    - ansible_facts.virtualization_type in ['kvm', 'qemu']
  block:
    - name: "Install qemu-guest-agent"
      ansible.builtin.apt:
        name: qemu-guest-agent
        state: present
        update_cache: true

    - name: "Enable qemu-guest-agent"
      ansible.builtin.systemd:
        name: qemu-guest-agent
        enabled: true

    # The service Requires= the virtio-serial channel, which only exists once
    # the agent is enabled on the Proxmox host AND the VM has been stopped/started.
    # Until then a start fails with a dependency-job error, which we tolerate; the
    # udev rule starts the service automatically once the channel appears.
    - name: "Start qemu-guest-agent if the virtio channel is present"
      ansible.builtin.systemd:
        name: qemu-guest-agent
        state: started
      register: qga_start
      failed_when:
        - qga_start is failed
        - "'dependency job' not in (qga_start.msg | default(''))"
