---
- name: Validate administrator credentials
  ansible.builtin.assert:
    that:
      - bootstrap_admin_user != 'root'
      - (sops.host_setup.password_hashed | default('', true)) | length > 0
      - (sops.host_setup.public_ssh_key | default('', true)) | length > 0
    fail_msg: "Set a non-root ansible_user and provide host_setup.password_hashed and host_setup.public_ssh_key in SOPS."

- name: Refresh APT package lists before installing bootstrap packages
  become: true
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts.pkg_mgr == 'apt'

- name: Install Fish and sudo before provisioning the administrator
  become: true
  ansible.builtin.package:
    name:
      - fish
      - sudo
    state: present

- name: Ensure administrator account exists
  become: true
  no_log: true
  ansible.builtin.user:
    name: "{{ bootstrap_admin_user }}"
    groups: sudo
    append: true
    shell: /usr/bin/fish
    create_home: true
    password: "{{ sops.host_setup.password_hashed }}"
    password_lock: false
    state: present

- name: Install administrator SSH key
  become: true
  ansible.posix.authorized_key:
    user: "{{ bootstrap_admin_user }}"
    key: "{{ sops.host_setup.public_ssh_key }}"
    state: present

- name: Ensure sudoers directory exists
  become: true
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Allow administrator to become root without a password
  become: true
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/90-ansible-{{ bootstrap_admin_user }}"
    content: "{{ bootstrap_admin_user }} ALL=(ALL) NOPASSWD: ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"

- name: Switch to administrator
  ansible.builtin.set_fact:
    ansible_user: "{{ bootstrap_admin_user }}"

- name: Reset connection before verifying administrator login
  ansible.builtin.meta: reset_connection

- name: Verify administrator login and sudo before hardening SSH
  become: true
  ansible.builtin.command: id -u
  register: bootstrap_sudo_check
  changed_when: false
  failed_when: bootstrap_sudo_check.stdout != '0'
